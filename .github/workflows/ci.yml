name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-security-refresh:
    name: Refresh patched backend dependencies
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-deps]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Update backend dependencies within supported major lines
        working-directory: backend
        run: |
          npm install --save "mongoose@^8.24.7" "express@^4.22.3" "nodemailer@^10.6.0"
          npm audit fix
          npm audit --json > "$RUNNER_TEMP/backend-npm-audit.json" || true
          node scripts/reportNpmAudit.js "$RUNNER_TEMP/backend-npm-audit.json"
      - name: Verify backend syntax and unit tests
        run: |
          find backend -path 'backend/node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cd backend && npm test
      - name: Update and audit frontend dependencies
        working-directory: frontend
        run: |
          npm uninstall react-devtools sort-by
          npm install "axios@^1.21.1" "react-router-dom@^7.18.5" "vite@^6.4.6" "@vitejs/plugin-react@^4.7.0"
          npm install "xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
          # npm may exit nonzero when only low-severity tooling advisories remain.
          # The explicit high/critical audit gate below is the release blocker.
          npm audit fix || true
          npm audit --json > "$RUNNER_TEMP/frontend-npm-audit.json" || true
          AUDIT_LABEL="Frontend dependency audit" node ../backend/scripts/reportNpmAudit.js "$RUNNER_TEMP/frontend-npm-audit.json"
          npm audit --audit-level=high
          npm run build
      - name: Commit the npm-generated lockfiles to main
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json; then
            echo "The dependency manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore(deps): apply backend and frontend security updates"
          git push origin HEAD:main

  backend:
    name: Backend syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Report backend dependency advisories
        working-directory: backend
        run: |
          npm audit --json > "$RUNNER_TEMP/backend-npm-audit.json" || true
          node scripts/reportNpmAudit.js "$RUNNER_TEMP/backend-npm-audit.json"
      - name: Enforce no high or critical backend advisories
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Check backend JavaScript syntax
        run: find backend -path 'backend/node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check operational shell script syntax
        run: |
          bash -n backend/ops/mongo-backup.sh
          bash -n backend/ops/mongo-restore-to-staging.sh
      - name: Run backend unit tests
        working-directory: backend
        run: npm test

  single-school-integration:
    name: Single-school workflow integration tests
    runs-on: ubuntu-latest
    env:
      MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017/preschool_integration?replicaSet=rs0
      JWT_SECRET: integration-only-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name preschool-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec preschool-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec preschool-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in $(seq 1 60); do
            if docker exec preschool-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              break
            fi
            sleep 1
          done
          docker exec preschool-mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) { quit(1); }"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run single-school workflow integration tests
        working-directory: backend
        run: npm run test:integration

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report frontend dependency advisories
        working-directory: frontend
        run: |
          npm audit --json > "$RUNNER_TEMP/frontend-npm-audit.json" || true
          AUDIT_LABEL="Frontend dependency audit" node ../backend/scripts/reportNpmAudit.js "$RUNNER_TEMP/frontend-npm-audit.json"
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock playwright@1.64.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright
        run: node --test e2e/browser-smoke.test.cjs
