name: Project checks

on:
  push:
    branches: [main, "fix/**", "ux/**", "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  backend:
    name: Backend syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        run: find backend -path 'backend/node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
