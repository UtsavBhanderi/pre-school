name: Project checks

on:
  push:
    branches: [main, "fix/**", "ux/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        run: find backend -path 'backend/node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check operational shell script syntax
        run: |
          bash -n backend/ops/mongo-backup.sh
          bash -n backend/ops/mongo-restore-to-staging.sh
      - name: Run backend unit tests
        working-directory: backend
        run: npm test

  tenant-integration:
    name: Tenant isolation integration tests
    runs-on: ubuntu-latest
    env:
      MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017/preschool_integration?replicaSet=rs0
      JWT_SECRET: integration-only-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name preschool-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec preschool-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec preschool-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in $(seq 1 60); do
            if docker exec preschool-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              break
            fi
            sleep 1
          done
          docker exec preschool-mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) { quit(1); }"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run tenant isolation integration tests
        working-directory: backend
        run: npm run test:integration

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
